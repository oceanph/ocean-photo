<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oksana Photo</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background:#fafafa;
            color:#222;
        }

        .hero{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            text-align:center;
        }

        h1{
            font-size:70px;
            font-weight:300;
            margin-bottom:20px;
        }

        p{
            font-size:22px;
            color:#666;
        }

        a.button{
            margin-top:40px;
            padding:16px 36px;
            text-decoration:none;
            background:black;
            color:white;
            border-radius:40px;
            transition:.3s;
        }

        a.button:hover{
            background:#444;
        }
    </style>

</head>

<body>

<section class="hero">

<h1>Oksana Photo</h1>

<p>Family & Portrait Photographer</p>

<a class="button" href="#">Book a Session</a>

</section>

</body>
</html>
